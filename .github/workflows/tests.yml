name: Tests

on:
  push:
    branches: [main]
    paths-ignore:
      - "data/**"           # tägliche Daten-Updates brauchen keinen Testlauf
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Code auschecken
        uses: actions/checkout@v7

      - name: uv installieren
        uses: astral-sh/setup-uv@v10.3.0

      - name: Abhängigkeiten installieren
        run: uv sync --frozen

      - name: Code-Stil prüfen (ruff)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Tests ausführen
        run: uv run pytest -q
