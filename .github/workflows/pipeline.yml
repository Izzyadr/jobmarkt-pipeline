name: Tägliche Pipeline

on:
  schedule:
    - cron: "15 5 * * *"   # täglich 05:15 UTC (07:15 Uhr Sommerzeit, 06:15 Uhr Winterzeit)
  workflow_dispatch:        # Knopf "Run workflow" für manuelle Starts

permissions:
  contents: write           # nötig, um die Datenbank zurück ins Repo zu schreiben

concurrency:
  group: pipeline           # nie zwei Läufe gleichzeitig
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30     # Notbremse, falls etwas hängt
    steps:
      - name: Code auschecken
        uses: actions/checkout@v7

      - name: uv installieren
        uses: astral-sh/setup-uv@v10

      - name: Abhängigkeiten installieren
        run: uv sync --frozen

      - name: Tests ausführen
        run: uv run pytest -q

      - name: Pipeline starten
        run: uv run python -m jobmarkt.pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Datenbank speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/jobs.duckdb
          git diff --cached --quiet && exit 0
          git commit -m "Daten-Update $(date +%F)"
          git pull --rebase
          git push