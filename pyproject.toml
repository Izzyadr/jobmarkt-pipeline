[project]
name = "jobmarkt"
version = "0.1.0"
description = "Tägliche Analyse von Stellenanzeigen mit LLM und Dashboard"
readme = "README.md"
authors = [
    { name = "Ismail Adruich", email = "ismail.adruich@stud.hn.de" }
]
requires-python = ">=3.13"
dependencies = [
    "anthropic>=1.15.0",
    "duckdb>=1.5.6",
    "pandas>=3.0.6",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "streamlit>=1.66.0",
]

[project.scripts]
jobmarkt = "jobmarkt.pipeline:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
